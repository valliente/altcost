name: AltCost Build & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web-deploy:
    name: Build & Deploy Web App (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "deploy: automated web app build for ${{ github.sha }}"

  desktop-release:
    name: Build Desktop Release Executable (.exe)
    runs-on: windows-latest
    needs: web-deploy
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Bundle
        run: npm run build

      - name: Execute Electron-Builder for Windows (.exe)
        run: npx electron-builder --win nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: altcost-windows-installer
          path: |
            dist_electron/*.exe
          retention-days: 7

      - name: Publish GitHub Release (Full Main Release)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist_electron/*.exe
          draft: false
          prerelease: false
          name: AltCost ${{ github.ref_name }} Release
          body: |
            ## 🚀 AltCost Alternative History Asset Comparison Engine - ${{ github.ref_name }}

            ### 📦 Download Desktop Executable:
            - **Windows Installer (`AltCost-Setup-0.1.2.exe`)**: Standard NSIS desktop installer.

            ### 🌐 Web Application:
            Access live web build on GitHub Pages.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
